/* ===== css: 00-tokens.css ===== */
/* Colores (claro y oscuro) y tonos pastel. Para cambiar la paleta: solo este archivo. */
:root{
  --bg:#E4EBE6; --grid:#D3DDD6; --paper:#FFFFFF; --soft:#F2F7F3; --ink:#24362D; --ink2:#587064; --ink3:#8A9E94; --line:#C7D5CC;
  --pink-bg:#FCE3E9; --pink-c:#F5B5C6; --pink-i:#A62A50;
  --lav-bg:#E6E3FA; --lav-c:#BDB6F0; --lav-i:#4A3FA3;
  --mint-bg:#D9F0DF; --mint-c:#A2D8B4; --mint-i:#1F7043;
  --yel-bg:#FDF2C4; --yel-c:#F6D872; --yel-i:#7F5A06;
  --red-bg:#FCDDD6; --red-c:#F5AB9C; --red-i:#A8301C;
  --blue-bg:#DBEEF9; --blue-c:#9ECFE9; --blue-i:#1D6290;
  --green-bg:#E0F1D3; --green-c:#B7DE9A; --green-i:#3A7220;
  /* Apple Calendar: fondo y texto muestreados de capturas reales */
  --ap-orange-bg:#FAE2BB; --ap-orange-c:#E0C299; --ap-orange-i:#784010;
  --ap-green-bg:#E7F3D6; --ap-green-c:#C9D6B5; --ap-green-i:#506030;
  --ap-cyan-bg:#C8ECFB; --ap-cyan-c:#A6CEE1; --ap-cyan-i:#205878;
  --ap-blue-bg:#B9E0FC; --ap-blue-c:#99C0E2; --ap-blue-i:#184078;
  --ap-purple-bg:#EEC5F6; --ap-purple-c:#D2A1DB; --ap-purple-i:#601070;
  --ap-red-bg:#F7CFCF; --ap-red-c:#DCACAC; --ap-red-i:#702020;
  --ap-teal-bg:#D3EAE7; --ap-teal-c:#B1CCC9; --ap-teal-i:#285550;
  --logo-red:#EC6868; --logo-blue:#5C98D0; --logo-yel:#FCF48C; --logo-line:#008C4C;
  --fd:'Fredoka','Trebuchet MS',sans-serif;
  --fb:'Nunito',-apple-system,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Sistema: sigue al iPhone salvo que se fuerce Claro */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A1F; --grid:#1D242B; --paper:#1E252C; --soft:#252E36; --ink:#E7F0EA; --ink2:#A4B8AE; --ink3:#728A80; --line:#33423D;
    --pink-bg:#3B2530; --pink-c:#5F3345; --pink-i:#FFB8CB;
    --lav-bg:#2B2850; --lav-c:#443F7E; --lav-i:#CBC5FF;
    --mint-bg:#1F3A2C; --mint-c:#2F5C46; --mint-i:#A8E8C0;
    --yel-bg:#3E3519; --yel-c:#5E4F1E; --yel-i:#FFE08A;
    --red-bg:#3E2622; --red-c:#64372F; --red-i:#FFB4A6;
    --blue-bg:#1F3544; --blue-c:#2E5670; --blue-i:#A9D8F3;
    --green-bg:#25381E; --green-c:#3A5A2C; --green-i:#BDE79F;
    --ap-orange-bg:#5B452D; --ap-orange-c:#865B2D; --ap-orange-i:#FAE2BB;
    --ap-green-bg:#3C4F36; --ap-green-c:#516D3D; --ap-green-i:#E7F3D6;
    --ap-cyan-bg:#2B4D5F; --ap-cyan-c:#356982; --ap-cyan-i:#C8ECFB;
    --ap-blue-bg:#2A4161; --ap-blue-c:#325486; --ap-blue-i:#B9E0FC;
    --ap-purple-bg:#46335A; --ap-purple-c:#633D7A; --ap-purple-i:#EEC5F6;
    --ap-red-bg:#553439; --ap-red-c:#7B3E42; --ap-red-i:#F7CFCF;
    --ap-teal-bg:#2C494B; --ap-teal-c:#356261; --ap-teal-i:#D3EAE7;
    --logo-red:#EC6868; --logo-blue:#5C98D0; --logo-yel:#FCF48C; --logo-line:#3DBE7E;
  }
}
/* Oscuro forzado */
:root[data-theme="dark"]{
  --bg:#151A1F; --grid:#1D242B; --paper:#1E252C; --soft:#252E36; --ink:#E7F0EA; --ink2:#A4B8AE; --ink3:#728A80; --line:#33423D;
  --pink-bg:#3B2530; --pink-c:#5F3345; --pink-i:#FFB8CB;
  --lav-bg:#2B2850; --lav-c:#443F7E; --lav-i:#CBC5FF;
  --mint-bg:#1F3A2C; --mint-c:#2F5C46; --mint-i:#A8E8C0;
  --yel-bg:#3E3519; --yel-c:#5E4F1E; --yel-i:#FFE08A;
  --red-bg:#3E2622; --red-c:#64372F; --red-i:#FFB4A6;
  --blue-bg:#1F3544; --blue-c:#2E5670; --blue-i:#A9D8F3;
  --green-bg:#25381E; --green-c:#3A5A2C; --green-i:#BDE79F;
  --ap-orange-bg:#5B452D; --ap-orange-c:#865B2D; --ap-orange-i:#FAE2BB;
  --ap-green-bg:#3C4F36; --ap-green-c:#516D3D; --ap-green-i:#E7F3D6;
  --ap-cyan-bg:#2B4D5F; --ap-cyan-c:#356982; --ap-cyan-i:#C8ECFB;
  --ap-blue-bg:#2A4161; --ap-blue-c:#325486; --ap-blue-i:#B9E0FC;
  --ap-purple-bg:#46335A; --ap-purple-c:#633D7A; --ap-purple-i:#EEC5F6;
  --ap-red-bg:#553439; --ap-red-c:#7B3E42; --ap-red-i:#F7CFCF;
  --ap-teal-bg:#2C494B; --ap-teal-c:#356261; --ap-teal-i:#D3EAE7;
  --logo-red:#EC6868; --logo-blue:#5C98D0; --logo-yel:#FCF48C; --logo-line:#3DBE7E;
}
.t-pink{--tb:var(--pink-bg);--tc:var(--pink-c);--ti:var(--pink-i)}
.t-lav{--tb:var(--lav-bg);--tc:var(--lav-c);--ti:var(--lav-i)}
.t-mint{--tb:var(--mint-bg);--tc:var(--mint-c);--ti:var(--mint-i)}
.t-yel{--tb:var(--yel-bg);--tc:var(--yel-c);--ti:var(--yel-i)}
.t-red{--tb:var(--red-bg);--tc:var(--red-c);--ti:var(--red-i)}
.t-blue{--tb:var(--blue-bg);--tc:var(--blue-c);--ti:var(--blue-i)}
.t-green{--tb:var(--green-bg);--tc:var(--green-c);--ti:var(--green-i)}
.t-ap-orange{--tb:var(--ap-orange-bg);--tc:var(--ap-orange-c);--ti:var(--ap-orange-i)}
.t-ap-green{--tb:var(--ap-green-bg);--tc:var(--ap-green-c);--ti:var(--ap-green-i)}
.t-ap-cyan{--tb:var(--ap-cyan-bg);--tc:var(--ap-cyan-c);--ti:var(--ap-cyan-i)}
.t-ap-blue{--tb:var(--ap-blue-bg);--tc:var(--ap-blue-c);--ti:var(--ap-blue-i)}
.t-ap-purple{--tb:var(--ap-purple-bg);--tc:var(--ap-purple-c);--ti:var(--ap-purple-i)}
.t-ap-red{--tb:var(--ap-red-bg);--tc:var(--ap-red-c);--ti:var(--ap-red-i)}
.t-ap-teal{--tb:var(--ap-teal-bg);--tc:var(--ap-teal-c);--ti:var(--ap-teal-i)}

/* ===== css: 10-base.css ===== */
/* Reset, tipografía, cabecera, navegación inferior. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;font:500 15px/1.45 var(--fb);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.app{max-width:520px;margin:0 auto;position:relative}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding:12px 14px 9px;border-bottom:2.5px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.logo{flex:1;min-width:0;max-width:205px}
.logo svg{display:block;width:100%;height:auto}
.sr{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand .sy{font:600 10px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 4px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;font:600 12px var(--fd);letter-spacing:.05em;padding:7px 13px;border-radius:999px;
  cursor:pointer;border:2.5px solid var(--line);background:var(--paper);color:var(--ink2)}
.strip button[aria-pressed=true]{background:var(--mint-c);border-color:var(--mint-i);color:var(--mint-i)}
.strip button.done{border-color:var(--pink-c)}
.strip button.done::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--pink-i);margin-left:6px;vertical-align:middle}
main{padding:16px 14px calc(var(--tab,68px) + env(safe-area-inset-bottom,0px) + 28px)}
section[hidden]{display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);
  border-top:2.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:transparent;cursor:pointer;padding:9px 0 8px;display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--ink3)}
nav button .ic{font-size:21px;--f:transparent}
nav button .lb{font:600 10px var(--fd);letter-spacing:.05em;text-transform:uppercase}
nav button[aria-pressed=true]{color:var(--mint-i)}
nav button[aria-pressed=true] .ic{--f:var(--mint-c)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== css: 11-iconos.css ===== */
/* Iconos, burbujas y mascotas. */
.ic{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.ic .f{fill:var(--f,none)}
.bub{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:var(--tb);color:var(--ti);--f:var(--tc);font-size:17px}
.masc{position:absolute;right:10px;top:8px;width:62px;height:auto;pointer-events:none}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mrow .sub{margin:0;flex:1}
.mrow .masc{position:static;width:48px;flex:none}
.spk{width:14px;height:14px;fill:var(--yel-c);stroke:var(--yel-i);stroke-width:1.4;stroke-linejoin:round}

/* ===== css: 20-componentes.css ===== */
/* Piezas reutilizables: tarjetas, botones, chips, filas, ecuaciones. */
button{font-family:inherit;color:inherit}
.card{background:var(--paper);border:2.5px solid var(--tc);border-radius:20px;margin-bottom:16px;
  overflow:hidden;box-shadow:0 4px 0 var(--tc);position:relative}
.band{display:flex;align-items:center;gap:9px;background:var(--tc);color:var(--ti);padding:9px 14px}
.band h2{margin:0;flex:1;font:600 16px var(--fd);letter-spacing:.01em}
.band .bi{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;
  background:var(--paper);color:var(--ti);--f:var(--tb);font-size:16px}
.tag{font:600 11px var(--fd);background:var(--paper);color:var(--ti);padding:3px 11px;border-radius:999px}
.body{padding:14px;position:relative}
.hint{font-size:12.5px;color:var(--ink2);margin:10px 0 0;line-height:1.45}
.sub{font:600 13px var(--fd);color:var(--ti);margin:0 0 10px}
.neg{color:var(--red-i)}
.pos{color:var(--mint-i)}
input[type=number],input[type=text],input[type=password],input[type=date],select,textarea{-webkit-appearance:none;appearance:none;
  width:100%;font:600 15px var(--fb);color:var(--ink);background:var(--soft);
  border:2px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ti)}
textarea{resize:vertical;min-height:80px;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--ti);margin:0;height:30px}
.biglab{display:block;font:600 16px var(--fd);margin-bottom:2px}
.bigin{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 12px}
.bigin input{width:210px;max-width:62%;text-align:center;font:600 42px var(--fd);color:var(--ti);
  background:transparent;border:0;border-bottom:3px dashed var(--tc);border-radius:0;padding:2px 0}
.bigin.small input{font-size:34px}
.bigin.left{justify-content:flex-start}
.bigin.left input{text-align:left;width:150px}
input::placeholder,textarea::placeholder{color:var(--ink3);opacity:.7}
.bigin span{font:600 26px var(--fd);color:var(--ink3)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:700 13px var(--fb);
  color:var(--ti);background:var(--tb);border:2px solid var(--tc);border-radius:999px;
  padding:8px 15px;cursor:pointer;--f:var(--tc)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;
  border-radius:14px;padding:12px;font:600 16px var(--fd);background:var(--ti);color:var(--paper);
  cursor:pointer;box-shadow:0 3px 0 var(--tc);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12.5px var(--fb);padding:7px 11px;
  border-radius:999px;border:2px solid var(--tc);background:var(--paper);color:var(--ti);
  cursor:pointer;--f:var(--tb)}
.chip.on{background:var(--tc);--f:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font:700 13.5px var(--fb);color:var(--ink2);margin-bottom:4px}
.fld label b{font:600 15px var(--fd);color:var(--ti)}
.seg{display:flex;gap:7px}
.seg button{flex:1;font:600 16px var(--fd);padding:10px 0;border-radius:12px;cursor:pointer;
  border:2.5px solid var(--tc);background:var(--paper);color:var(--ti)}
.seg button[aria-pressed=true]{background:var(--tc)}
.sw{position:relative;width:46px;height:27px;flex:none;border:0;padding:0;cursor:pointer;
  background:var(--ink3);border-radius:14px;transition:background .18s}
.sw[aria-pressed=true]{background:var(--mint-i)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
  background:#fff;border-radius:50%;transition:transform .18s}
.sw[aria-pressed=true]::after{transform:translateX(19px)}
button:focus-visible{outline:2.5px solid var(--yel-i);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dotted var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .nm{display:block;font:700 14px var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mt{display:block;font:600 11px var(--fb);color:var(--ink3)}
.row .am{font:600 15px var(--fd);white-space:nowrap}
.row.off .nm,.row.off .am{color:var(--ink3);text-decoration:line-through}
.del{border:0;background:transparent;color:var(--ink3);cursor:pointer;padding:6px;display:grid;place-items:center}
.grp{border-radius:16px;background:var(--tb);padding:4px 12px 4px;margin-bottom:10px;border:2px solid var(--tc)}
.grp .gh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 4px;
  font:600 13px var(--fd);color:var(--ti);letter-spacing:.02em}
.grp .gh b{font:600 14px var(--fd)}
.grp .row{border-bottom-color:var(--tc)}
.eqcol{display:flex;flex-direction:column}
.opr{display:flex;align-items:center;gap:8px;margin-top:8px}
.opr:first-child{margin-top:0}
.op{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink3);
  display:grid;place-items:center;font:700 19px var(--fd);color:var(--ink2);line-height:1}
.op.ghost{border-color:transparent;background:transparent}
.eqb{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tb);
  border:2.5px solid var(--tc);border-radius:14px;padding:10px 12px}
.eqb span{font:700 13px var(--fb);color:var(--ti)}
.eqb b{font:600 19px var(--fd);color:var(--ink);white-space:nowrap}
.eqb.strong{background:var(--tc)}
.eqb b.neg{color:var(--red-i)}
.note{font-size:12px;color:var(--ink2);line-height:1.5;margin:0}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;
  border-bottom:2px dotted var(--line)}
.kv div:last-child{border-bottom:0}
.kv .l{font:600 14px var(--fb);color:var(--ink2)}
.kv .l small{display:block;font:600 11px var(--fb);color:var(--ink3)}
.kv .v{font:600 16px var(--fd);white-space:nowrap}
.kv .big{border-top:2.5px solid var(--ti);margin-top:4px;padding-top:11px}
.kv .big .l{color:var(--ink);font-weight:800}
.kv .big .v{font-size:21px}
.check{background:var(--tb);border:2px dashed var(--tc);border-radius:14px;padding:10px 12px;
  font:600 12.5px var(--fb);color:var(--ink);margin-top:12px;line-height:1.6}

/* Desplegables: dibujo propio (el nativo mete un segundo borde y recorta el texto) con flecha que sigue al tema */
select{padding-right:34px;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 13px) 52%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
/* Fecha: Safari móvil le da un ancho propio enorme; hay que permitir que se encoja dentro de su celda */
input[type=date]{min-width:0;max-width:100%;min-height:42px;line-height:1.2;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
/* las celdas de una rejilla no pueden negarse a encogerse por culpa de su contenido */
.two>*,.ccg>*,.tu .g>*{min-width:0}

.body>.grp:last-child{margin-bottom:0}

/* ===== css: 21-avisos.css ===== */
/* Avisos (toast) y mensajes de error. */
.toast{position:fixed;left:50%;top:96px;transform:translate(-50%,-10px);
  opacity:0;pointer-events:none;z-index:70;max-width:88%;padding:11px 16px;border-radius:14px;
  border:2.5px solid var(--tc);background:var(--tb);color:var(--ti);font:700 14px var(--fb);
  box-shadow:0 4px 0 var(--tc);text-align:center;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.err{margin:-4px 0 10px;text-align:center;font:700 13px var(--fb);color:var(--red-i)}

/* ===== css: 50-tab-inicio.css ===== */
/* Estilos propios de Inicio. */
.yrow{display:grid;grid-template-columns:34px 1fr 74px;gap:9px;align-items:center;padding:5px 0}
.yrow .mn{font:600 11px var(--fd);letter-spacing:.05em;color:var(--ink3)}
.yrow.cur .mn{color:var(--ti)}
.yrow .tr{height:10px;background:var(--tb);border-radius:6px;overflow:hidden;border:1.5px solid var(--tc)}
.yrow .fl{display:block;height:100%;border-radius:6px;background:var(--tc)}
.yrow.neg .fl{background:var(--red-c)}
.yrow .vv{font:600 12.5px var(--fd);text-align:right}
.restiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.restile{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;min-width:0;min-height:128px;padding:14px 8px;
  border-radius:22px;background:var(--tb);color:var(--ti);border:2.5px solid var(--tc);box-shadow:0 5px 0 var(--tc);text-align:center}
.restile .rl{font:600 13px var(--fd);letter-spacing:.04em;text-transform:uppercase}
.restile .rv{font:700 clamp(24px,8vw,34px) var(--fd);line-height:1.05;overflow-wrap:anywhere}

/* ===== css: 51-tab-diario.css ===== */
/* Estilos propios de Diario. */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cat{background:var(--paper);border:2.5px solid var(--tc);border-radius:18px;padding:11px;
  box-shadow:0 3px 0 var(--tc)}
.cat .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat .cn{font:600 13px var(--fd);color:var(--ti)}
.cat .cv{font:600 22px var(--fd);letter-spacing:-.01em}
.cat .cv small{font:600 12px var(--fb);color:var(--ink3)}
.bar{height:10px;border-radius:6px;background:var(--tb);margin:7px 0 6px;overflow:hidden;border:1.5px solid var(--tc)}
.bar i{display:block;height:100%;background:var(--tc);border-radius:6px}
.cat.over .bar i{background:var(--red-i)}
.cat .cr{font:700 12px var(--fb);color:var(--ink2)}
.cat .cr.neg{color:var(--red-i)}
.tbl{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12.5px}
.tbl th{font:600 11px var(--fd);padding:4px 3px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px 4px;text-align:right;font:600 12.5px var(--fd);background:var(--soft)}
.tbl td:first-child{border-radius:9px 0 0 9px;font-weight:600}
.tbl td:last-child{border-radius:0 9px 9px 0}
.tbl tr.tot td{background:var(--tc);color:var(--ti)}
.tbl .c-lav{color:var(--lav-i)}
.tbl .c-green{color:var(--green-i)}
.tbl .c-pink{color:var(--pink-i)}
.tbl .c-yel{color:var(--yel-i)}
.wks{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.wkb{background:var(--tb);border:2.5px solid var(--tc);border-radius:14px;padding:8px 6px;text-align:center}
.wkb small{display:block;font:600 11px var(--fd);color:var(--ti)}
.wkb b{font:600 16px var(--fd)}

/* ===== css: 52-tab-turnos.css ===== */
/* Estilos propios de Turnos. */
.cal{display:grid;gap:4px}
.cdow,.crow{display:grid;grid-template-columns:20px repeat(7,1fr);gap:4px}
.cdow span{text-align:center;font:600 11px var(--fd);color:var(--ink3)}
.cwn{font:600 9px var(--fd);color:var(--ink3);align-self:center;text-align:center}
.cd{min-height:56px;background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:3px 2px;
  display:flex;flex-direction:column;gap:2px;align-items:stretch;cursor:pointer;color:var(--ink);min-width:0}
.cd.out{opacity:.32}
.cd.fest .dn{color:var(--red-i)}
.cd.sel{border-color:var(--ti);background:var(--tb)}
.cd .dn{font:600 11px var(--fd);width:19px;height:19px;display:grid;place-items:center;border-radius:50%}
.cd.today .dn{background:var(--ti);color:var(--paper)}
.pl{font:800 8.5px var(--fb);border-radius:6px;padding:2px 1px;text-align:center;background:var(--tb);
  color:var(--ti);overflow:hidden;white-space:nowrap}
.tu{border:2.5px solid var(--tc);border-radius:16px;padding:10px;margin-bottom:10px;background:var(--tb)}
.tu .top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.tu .top select{flex:1}
.tu .g{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:7px}
.tu .g label{display:block;font:700 10px var(--fb);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ti);margin-bottom:3px}
.tu .res{font:600 12px var(--fb);color:var(--ink2);margin-top:8px}
.tu .res b{color:var(--ti)}

/* ===== css: 53-tab-cierre.css ===== */
/* Estilos propios de Cierre. */
.ccrow{background:var(--tb);border:2.5px solid var(--tc);border-radius:16px;padding:10px;margin-bottom:10px}
.ccg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ccg .full{grid-column:1/-1}
.ccg input{padding:8px 9px;font-size:14px}
.q{margin-bottom:14px}
.q p{margin:0 0 6px;font:700 14px var(--fb)}
.q .auto{font:600 11.5px var(--fb);color:var(--ink3);margin-top:5px}
.qa{display:flex;gap:7px}
.qa button{flex:1;font:600 14px var(--fd);padding:8px 0;border-radius:12px;cursor:pointer;
  border:2.5px solid var(--tc);background:var(--paper);color:var(--ti)}
.qa button.on{background:var(--tc)}
.tip{background:var(--pink-i);color:var(--paper);border-radius:18px;padding:14px 14px 14px 16px;
  margin-bottom:16px;position:relative;box-shadow:0 4px 0 var(--pink-c)}
.tip b{display:inline-block;font:600 11px var(--fd);letter-spacing:.08em;text-transform:uppercase;
  background:var(--paper);color:var(--pink-i);padding:2px 9px;border-radius:7px;margin-bottom:6px}
.tip p{margin:0;font:600 13.5px/1.5 var(--fb)}
.ccg label{display:block;font:700 10px var(--fb);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ti);margin-bottom:3px}

/* ===== css: 55-tab-sync.css ===== */
/* Sincronización con Google Calendar: mensajes, botón desactivado y puntos de agenda en el calendario. */
.okmsg{margin:0 0 10px;text-align:center;font:700 13px var(--fb);color:var(--mint-i)}
.warnmsg{margin:0 0 10px;text-align:center;font:700 13px var(--fb);color:var(--yel-i)}
.cta[disabled]{opacity:.55;cursor:default}
.evd{display:flex;gap:2px;justify-content:center;margin-top:auto;padding-bottom:1px}
.evd i{display:block;width:6px;height:6px;border-radius:50%;background:var(--ti)}

/* ===== css: 60-asistente.css ===== */
/* Hoja inferior y asistente Antes de comprar. */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
/* es un <button>: Safari móvil solo envía el clic a elementos interactivos */
.shbg{position:absolute;inset:0;border:0;padding:0;background:rgba(20,30,25,.5);cursor:pointer}
.shbox{position:relative;width:100%;max-width:520px;max-height:90%;overflow:auto;background:var(--paper);
  border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));
  border:2.5px solid var(--tc);border-bottom:0}
.shbox h3{margin:0 0 4px;font:700 20px var(--fd)}
.shq{font:600 19px/1.3 var(--fd);margin:8px 0 16px}
.opt{display:block;width:100%;text-align:left;font:700 15px var(--fb);padding:13px 15px;margin-bottom:9px;
  border-radius:14px;border:2.5px solid var(--tc);background:var(--tb);color:var(--ink);cursor:pointer}
.res-box{border-radius:18px;padding:16px;background:var(--tb);border:2.5px solid var(--tc);text-align:center}
.res-box .ic{font-size:34px;color:var(--ti);--f:var(--tc)}
.res-box h4{margin:6px 0 4px;font:700 22px var(--fd);color:var(--ti)}
.res-box p{margin:0;font:600 14px/1.5 var(--fb);color:var(--ink)}

</style>
</head>

</div>

function localParts(iso,tz){

    catch(e){if(e&&e.retryable&&k===0){await sleep(e.retryAfterMs||(1000+Math.random()*800));continue}throw e}}}
async function listAllEvents(calId,from,to){

  for(let page=0;page<8;page++){
    const p=await gcalCall("list_events",Object.assign({calendarId:calId,startTime:from,endTime:to,orderBy:"startTime",pageSize:250},tok?{pageToken:tok}:{}));
    out.push(...((p&&p.events)||[]));tok=p&&p.nextPageToken;if(!tok)break}
  return out}
async function calendarFinder(){
  const p=await gcalCall("list_calendars",{});const list=(p&&p.calendars)||[];
  return name=>list.find(c=>norm(c.summary)===norm(name))}

const needsPermission=e=>!!e&&["not_in_manifest","consent_required","not_granted"].indexOf(e.code)>=0;

/* ---------- eventos -> turnos ---------- */
const excluded=(title,list)=>{const t=norm(title);return String(list||"").split(",").map(norm).filter(Boolean).some(x=>t.indexOf(x)>=0)};
function parseShift(cal,ev,excludeList){
  if(!ev||!ev.start||!ev.start.dateTime)return null;                 /* los eventos de día completo no son turnos */
  if(excluded(ev.summary,excludeList))return null;
  const s=localParts(ev.start.dateTime,ev.start.timeZone);if(!s||+s.d.slice(0,4)!==YEAR)return null;
  let t=cal.type;
  if(cal.codes){const m=/\bN3F([12])?\b/i.exec(ev.summary||"");if(!m)return null;t="N3F"+(m[1]||"")}   /* ignora lo que no sea guardia */
  let h=TIPO[t][2];
  if(!cal.codes&&ev.end&&ev.end.dateTime){const e=localParts(ev.end.dateTime,ev.end.timeZone);
    const dur=e?Math.round((e.ms-s.ms)/36e5):0;if(dur>=1&&dur<=24)h=dur}  /* guardias: duración fija (el calendario recorta la noche) */
  return{gid:ev.id,d:s.d,t,s:s.h,h}}
function parseAgenda(cal,ev){
  if(!ev||!ev.start||ev.status==="cancelled")return null;
  const pad=n=>String(n).padStart(2,"0");
  if(!ev.start.dateTime)return{id:ev.id,cal:cal.key,title:ev.summary||"(sin título)",d:ev.start.date,s:"",e:"",loc:(ev.location||"").split("\n")[0],allDay:true};
  const s=localParts(ev.start.dateTime,ev.start.timeZone),e=ev.end&&ev.end.dateTime?localParts(ev.end.dateTime,ev.end.timeZone):null;
  if(!s)return null;
  return{id:ev.id,cal:cal.key,title:ev.summary||"(sin título)",d:s.d,s:pad(s.h)+":"+pad(s.m),e:e?pad(e.h)+":"+pad(e.m):"",loc:(ev.location||"").split("\n")[0]}}

/* ---------- fusión con los turnos guardados ----------
   - quita los que vinieron del calendario y ya no existen (solo de calendarios leídos con éxito)
   - actualiza los cambiados y los mueve de mes si hace falta
   - adopta un turno manual idéntico (misma fecha y tipo) en lugar de duplicarlo
   - respeta los borrados a propósito (st.sync.ign) y no toca los turnos manuales */
function mergeShifts(fetched,okTypes){
  const rep={added:0,updated:0,removed:0,adopted:0},ign=new Set(st.sync.ign||[]);
  const gids=new Set(fetched.map(f=>f.gid));
  for(let m=0;m<12;m++)st.tur[m]=(st.tur[m]||[]).filter(x=>{
    if(x.src!=="gcal"||!okTypes.has(x.t)||gids.has(x.gid))return true;rep.removed++;return false});
  const all=[];for(let m=0;m<12;m++)st.tur[m].forEach(x=>all.push({m,x}));
  const byGid=new Map(all.filter(o=>o.x.gid).map(o=>[o.x.gid,o]));
  fetched.forEach(f=>{
    if(ign.has(f.gid))return;
    let o=byGid.get(f.gid);
    if(!o){o=all.find(q=>!q.x.src&&q.x.d===f.d&&q.x.t===f.t);
      if(o){o.x.src="gcal";o.x.gid=f.gid;byGid.set(f.gid,o);rep.adopted++}}
    const mNew=+f.d.slice(5,7)-1;
    if(o){const x=o.x;
      if(x.d!==f.d||x.t!==f.t||x.h!==f.h||x.s!==f.s){x.d=f.d;x.t=f.t;x.h=f.h;x.s=f.s;rep.updated++}
      if(o.m!==mNew){st.tur[o.m]=st.tur[o.m].filter(y=>y!==x);st.tur[mNew].push(x);o.m=mNew}
    }else{const x={d:f.d,t:f.t,h:f.h,s:f.s,src:"gcal",gid:f.gid};st.tur[mNew].push(x);
      const q={m:mNew,x};all.push(q);byGid.set(f.gid,q);rep.added++}});
  rep.total=all.filter(o=>o.x.src==="gcal").length;
  return rep}

/* ---------- operaciones completas ---------- */
/* Lee los 4 calendarios de turnos y los fusiona. Si cualquier lectura falla, NO cambia nada. */
async function syncShifts(){
  const find=await calendarFinder(),fetched=[],okTypes=new Set(),missing=[];let ignored=0;
  for(const c of SHIFT_CALS){
    const cal=find(c.name);if(!cal){missing.push(c.name);continue}
    const evs=await listAllEvents(cal.id,SYNC_FROM,SYNC_TO);
    (c.codes?["N3F","N3F1","N3F2"]:[c.type]).forEach(t=>okTypes.add(t));
    evs.forEach(ev=>{const it=parseShift(c,ev,st.sync.exclude);if(it)fetched.push(it);else ignored++})}
  const rep=mergeShifts(fetched,okTypes);
  st.sync.last=Date.now();st.sync.n=rep.total;st.sync.rep=rep;
  return{rep,missing,ignored}}

/* Agenda en memoria (no se guarda): ventana móvil de -14 a +120 días. Cada calendario falla por separado. */
let AGENDA=[];
async function loadAgenda(){
  const find=await calendarFinder(),out=[],errs=[],from=addDaysISO(-14),to=addDaysISO(120);
  for(const c of AGENDA_CALS){
    if(!st.sync.cal[c.key])continue;
    const cal=find(c.name);if(!cal){errs.push(c.name+": no encuentro el calendario");continue}
    try{(await listAllEvents(cal.id,from,to)).forEach(ev=>{const it=parseAgenda(c,ev);if(it)out.push(it)})}
    catch(e){errs.push(c.name+": "+gcalErrorText(e));if(needsPermission(e))break}}
  AGENDA=out;return{n:out.length,errs}}

document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset&&t.dataset.k;if(!k||t.dataset.nr)return;
  if(C[k])try{C[k](t)}catch(err){reportError(err);return}

/* Solo en la versión de GitHub Pages: guarda tu presupuesto en tu repo privado (presupuesto.json) y lo lee al abrir.
   El token vive solo en este dispositivo. Si dos dispositivos cambian a la vez, gana el cambio más reciente. */
const GHK="kakebo.gh", GHAT="kakebo.ghAt", GHF="presupuesto.json";
let gh=null;try{gh=JSON.parse(localStorage.getItem(GHK)||"null")}catch(e){}
let ghSha=null, ghTimer=null, ghBusy=false, ghAgain=false, ghMsg=null, ghLast=0, ghForm={repo:gh?gh.repo:"",tk:""};

const ghAt=()=>+localStorage.getItem(GHAT)||0;
const ghUrl=()=>"https://api.github.com/repos/"+gh.repo+"/contents/"+GHF;
const ghH=()=>({Authorization:"Bearer "+gh.tk,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
const ghErr=(status)=>new Error(status===401?"El token no es válido o ha caducado.":status===403?"GitHub rechaza el acceso (permisos del token o límite de uso).":
  status===404?"No encuentro el repo de datos. Revisa el nombre y los permisos del token.":"GitHub ha respondido "+status+".");
const ghStatus=t=>{const el=$("sync");if(el)el.textContent="2026 · "+t};

async function ghGet(){
  const r=await fetch(ghUrl()+"?t="+Date.now(),{headers:ghH(),cache:"no-store"});
  if(r.status===404){ghSha=null;return null}
  if(!r.ok)throw ghErr(r.status);
  const j=await r.json();ghSha=j.sha;
  return JSON.parse(unb64(j.content))}

function ghAdopt(r){
  st=migrate(r.st);try{localStorage.setItem("kakebo2026",JSON.stringify(st))}catch(e){}
  localStorage.setItem(GHAT,String(r.at));refresh()}

async function ghPut(at){
  const mk=()=>({method:"PUT",headers:ghH(),body:JSON.stringify({message:"kakebo "+new Date(at).toISOString(),
    content:b64(JSON.stringify({at,st})),...(ghSha?{sha:ghSha}:{})})});
  let r=await fetch(ghUrl(),mk());
  if(r.status===409||r.status===422){                 /* alguien (otro dispositivo) escribió antes: se mira qué es más reciente */
    const x=await ghGet();
    if(x&&x.at>at){ghAdopt(x);return "remoto"}
    r=await fetch(ghUrl(),mk())}
  if(!r.ok)throw ghErr(r.status);
  ghSha=(await r.json()).content.sha;return "subido"}

async function ghSync(){
  if(!gh)return;
  if(ghBusy){ghAgain=true;return}
  ghBusy=true;ghStatus("sincronizando");
  try{
    const r=await ghGet(),la=ghAt();let how;
    if(r&&r.at>la){ghAdopt(r);how="remoto"}
    else if(!r||la>r.at){how=await ghPut(la||Date.now())}
    else how="igual";
    ghMsg={tone:"mint",text:how==="remoto"?"Datos cargados desde GitHub.":how==="subido"?"Cambios guardados en GitHub.":"Todo al día."};
    ghLast=Date.now();ghStatus("guardado en GitHub")}
  catch(e){ghMsg={tone:"red",text:e.message||String(e)};ghStatus("sin conexión con GitHub")}
  ghBusy=false;
  if(ghAgain){ghAgain=false;ghSync();return}
  if(tab==="ajustes")refresh()}

Object.assign(A,{
  ghnow:()=>{ghMsg=null;ghSync();refresh()},
  ghoff:()=>{try{localStorage.removeItem(GHK)}catch(e){}gh=null;ghMsg=null;ghStatus("solo en este dispositivo");refresh()},
  ghon:async()=>{
    const repo=ghForm.repo.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),tk=ghForm.tk.trim();
    const bad=t=>{ghMsg={tone:"red",text:t};refresh();const r=$("ghR");if(r)r.value=ghForm.repo};
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return bad("Escribe el repo como usuario/repo.");
    if(!tk)return bad("Pega tu token de GitHub.");
    try{
      const r=await fetch("https://api.github.com/repos/"+repo,{headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json"},cache:"no-store"});
      if(!r.ok)return bad(r.status===401?"El token no es válido o ha caducado.":"No encuentro ese repo. Revisa el nombre y los permisos del token.");
      const j=await r.json();
      if(j.private===false)return bad("Ese repo es PÚBLICO: cualquiera vería tu presupuesto. Hazlo privado en GitHub.");
      if(j.permissions&&j.permissions.push===false)return bad("El token solo puede leer: necesita permiso de escritura en Contenido.")}
    catch(e){return bad("No he podido conectar con GitHub: "+(e.message||e))}
    gh={repo,tk};localStorage.setItem(GHK,JSON.stringify(gh));ghForm.tk="";ghMsg=null;refresh();ghSync()}
});

/* Asistente "Antes de comprar: ¿ahorro o me lo gasto?" (hoja inferior). Independiente de las pestañas. */
let wiz=null;
const TREE={q1:["¿Lo necesitas de verdad o es un capricho?",[["Lo necesito","n1"],["Es un capricho","c1"]]],
 n1:["¿Hay una opción más barata que te sirva?",[["Sí","n2"],["No","n3"]]],
 n2:["¿Te conformarías con la más barata?",[["Sí","rBarata"],["No","n3"]]],
 n3:["¿Es la mejor opción en calidad y precio?",[["Sí","rCompra"],["No","rPiensa"]]],
 c1:["¿Te seguirá apeteciendo dentro de una semana?",[["Sí","c2"],["No","rEspera"]]],
 c2:["¿Es para ti o es un regalo?",[["Es para mí","rOcio"],["Es un regalo","rRegalo"]]]};
const remTot=()=>presup(sel)-gastoMes(sel);
function wizInfo(){const c=wiz.c,r=catRem(sel,c),t=remTot(),a=wiz.amt;
  return `En <b>${CAT[c].n}</b> te quedan <b>${eur(r)}</b> este mes y en total <b>${eur(t)}</b>.`+
    (a>0?`<br>${a<=r+0.005?"Cabe en este sobre.":"No cabe: te pasarías "+eur(a-r)+" en "+CAT[c].n+"."}`:"")}
function wizResult(id){const a=wiz.amt,c=id==="rRegalo"?"extra":wiz.c,r=catRem(sel,c),fits=a<=r+0.005,t=remTot();
  const X={rBarata:["mint","check","Compra la barata","Te cumple y tu bolsillo lo agradece."],
   rCompra:["mint","check","Compra, está justificado","Lo necesitas y es la mejor relación calidad y precio."],
   rPiensa:["yel","spark","Piénsalo dos veces","Lo necesitas, pero no parece la mejor opción. Compara un poco más antes de pagar."],
   rEspera:["red","moon","Espera una semana","Si dentro de siete días ya no te apetece, ese dinero estaba mejor ahorrado."],
   rOcio:fits?["mint","check","Cómpralo sin culpa","Cabe en tu sobre de "+CAT[c].n+"."]:["red","x","Hoy no toca","No cabe en tu sobre de "+CAT[c].n+": te pasarías "+eur(a-r)+"."],
   rRegalo:fits?["mint","gift","Regala tranquilo","Cabe en tu sobre de Extras."]:["yel","gift","Mira el sobre de Extras","Te pasarías "+eur(a-r)+" en Extras. Puedes bajar el presupuesto del regalo."]}[id];
  const warn=(a>0&&a>t+0.005&&X[0]!=="red")?`<p style="margin-top:10px" class="neg"><b>Ojo:</b> supera lo que te queda del mes entero (${eur(t)}).</p>`:"";
  return `<div class="res-box t-${X[0]}">${ic(X[1])}<h4>${X[2]}</h4><p>${X[3]}</p>${warn}</div>
   <button class="cta" data-a="wclose" data-nr="1">Cerrar</button><button class="pill" data-a="wreset" data-nr="1" style="width:100%;margin-top:10px">Empezar de nuevo</button>`}
function renderSheet(){
  const el=$("shin");$("sheet").hidden=!wiz;if(!wiz)return;
  if(wiz.step==="amt"){
    el.innerHTML=`<h3>Antes de comprar</h3><p class="hint" style="margin-top:0">¿Ahorro o me lo gasto? Dos minutos de calma.</p>
    <div class="bigin small"><input id="wAmt" data-k="wamt" data-nr="1" type="text" inputmode="decimal" autocomplete="off" placeholder="Importe" value="${wiz.amt?fmtIn(wiz.amt):""}"><span>€</span></div>
    <div class="chips">${CK.map(k=>`<button class="chip t-${CAT[k].t}${k===wiz.c?" on":""}" data-a="wcat" data-nr="1" data-v="${k}">${ic(CAT[k].ic)}${CAT[k].n}</button>`).join("")}</div>
    <p class="hint" id="wInfo">${wizInfo()}</p><button class="cta" data-a="wnext" data-nr="1">Siguiente</button>`;
  }else if(TREE[wiz.step]){const[q,o]=TREE[wiz.step];
    el.innerHTML=`<p class="shq">${q}</p>${o.map(([t,n])=>`<button class="opt" data-a="wpick" data-nr="1" data-v="${n}">${t}</button>`).join("")}
    <button class="pill" data-a="wback" data-nr="1" style="margin-top:6px">${ic("back")} Atrás</button>`;
  }else el.innerHTML=wizResult(wiz.step)}

Object.assign(I,{wamt:t=>{wiz.amt=Math.max(0,num(t.value));$("wInfo").innerHTML=wizInfo()}});
Object.assign(A,{
  wopen:()=>{wiz={step:"amt",amt:0,c:"ocio",hist:[]};renderSheet()},
  wclose:()=>{wiz=null;renderSheet()},
  wcat:b=>{wiz.c=b.dataset.v;renderSheet()},
  wnext:()=>{wiz.hist=["amt"];wiz.step="q1";renderSheet()},
  wpick:b=>{wiz.hist.push(wiz.step);wiz.step=b.dataset.v;renderSheet()},
  wback:()=>{wiz.step=wiz.hist.pop()||"amt";renderSheet()},
  wreset:()=>{wiz={step:"amt",amt:wiz.amt,c:wiz.c,hist:[]};renderSheet()}
});

<script>
/* Arranque de la web en GitHub Pages.
   El código de esta página es público y NO lleva tus datos personales. Esos datos (datos-personales.js) viven en tu repo
   privado y se descargan con tu token; se guardan en este dispositivo para que la app abra al instante y sin conexión. */
(function(){
  var KEY="kakebo.gh", PERS="kakebo.pers", gh=null;
  try{gh=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  var appEl=document.getElementById("appjs"), bootEl=document.getElementById("boot");
  function run(pers){var s=document.createElement("script");s.textContent=appEl.textContent.replace("/*@@PERSONAL@@*/",function(){return pers});document.head.appendChild(s);bootEl.hidden=true}
  function hdr(tk,raw){return{Authorization:"Bearer "+tk,Accept:raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
  function fail(status,what){return new Error(status===401?"El token no es válido o ha caducado.":status===403?"GitHub rechaza el acceso (permisos del token o límite de uso).":status===404?what:"GitHub ha respondido "+status+".")}
  async function checkRepo(repo,tk){
    var r=await fetch("https://api.github.com/repos/"+repo,{headers:hdr(tk),cache:"no-store"});
    if(!r.ok)throw fail(r.status,"No encuentro ese repositorio. Revisa el nombre (usuario/repo) y que el token tenga acceso a él.");
    var j=await r.json();
    if(j.private===false)throw new Error("Ese repositorio es PÚBLICO: cualquiera vería tu presupuesto. Hazlo privado en GitHub y vuelve a intentarlo.");
    if(j.permissions&&j.permissions.push===false)throw new Error("El token solo puede leer. Necesita permiso de escritura en Contenido.")}
  async function fetchPers(g){
    var r=await fetch("https://api.github.com/repos/"+g.repo+"/contents/datos-personales.js?t="+Date.now(),{headers:hdr(g.tk,true),cache:"no-store"});
    if(!r.ok)throw fail(r.status,"No encuentro datos-personales.js en ese repo. Súbelo a la raíz de tu repo de datos (paso 4 de la guía).");
    return r.text()}
  function form(msg,repo){
    bootEl.hidden=false;
    bootEl.innerHTML='<div class="card t-mint"><div class="band"><h2>Conectar tus datos</h2></div><div class="body">'+
      '<p class="hint" style="margin-top:0">Esta web no guarda tus números. Se leen de tu repo privado de GitHub con un token que se queda solo en este dispositivo.</p>'+
      '<div class="fld" style="margin-top:14px"><label for="bRepo">Repo de datos</label><input id="bRepo" type="text" placeholder="tuusuario/kakebo-datos" autocapitalize="off" autocomplete="off" spellcheck="false"></div>'+
      '<div class="fld"><label for="bTk">Token de GitHub</label><input id="bTk" type="password" placeholder="github_pat_..." autocapitalize="off" autocomplete="off" spellcheck="false"></div>'+
      '<p class="err" id="bErr" role="status"></p><button class="cta" id="bGo">Conectar</button></div></div>';
    document.getElementById("bRepo").value=repo||"";document.getElementById("bErr").textContent=msg||"";
    document.getElementById("bGo").addEventListener("click",connect)}
  async function connect(){
    var repo=document.getElementById("bRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),
        tk=document.getElementById("bTk").value.trim(), err=document.getElementById("bErr"), go=document.getElementById("bGo");
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){err.textContent="Escribe el repo como usuario/repo.";return}
    if(!tk){err.textContent="Pega tu token de GitHub.";return}
    go.disabled=true;go.textContent="Comprobando";err.textContent="";
    try{await checkRepo(repo,tk);var g={repo:repo,tk:tk},t=await fetchPers(g);
      localStorage.setItem(KEY,JSON.stringify(g));localStorage.setItem(PERS,t);gh=g;run(t)}
    catch(e){err.textContent=e.message||String(e);go.disabled=false;go.textContent="Conectar"}}
  var cached=null;try{cached=localStorage.getItem(PERS)}catch(e){}
  if(cached){run(cached);
    if(gh&&navigator.onLine)fetchPers(gh).then(function(t){if(t!==cached)localStorage.setItem(PERS,t)}).catch(function(){})}
  else if(!gh)form("");
  else fetchPers(gh).then(function(t){localStorage.setItem(PERS,t);run(t)}).catch(function(e){form(e.message,gh.repo)});
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
